name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view --repo "$GITHUB_REPOSITORY" --json tagName \
              --jq .tagName > /tmp/tag.txt 2>/dev/null; then
            echo "No release yet — deploying with placeholders."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(cat /tmp/tag.txt)
          version=${tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/gifcap-release
          cd /tmp/gifcap-release
          url=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | test("windows-x64\\.zip$")) | .browserDownloadUrl' | head -1)
          if [ -z "$url" ]; then
            echo "Missing zip asset in $tag" >&2
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o zip "$url"
          {
            echo "zip_hash=$(sha256sum zip | cut -d' ' -f1)"
            echo "zip_size=$(awk -v b="$(stat -c %s zip)" 'BEGIN{printf "%.1f", b/1048576}')"
          } >> "$GITHUB_OUTPUT"

      - name: Fill release data into the site
        if: steps.release.outputs.version != ''
        run: |
          set -euo pipefail
          cd site
          for page in index.html en/index.html; do
            sed -i \
              -e 's/@@VERSION@@/${{ steps.release.outputs.version }}/g' \
              -e 's/@@HASH_ZIP@@/${{ steps.release.outputs.zip_hash }}/g' \
              -e 's/@@SIZE_ZIP@@/${{ steps.release.outputs.zip_size }}/g' \
              "$page"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
